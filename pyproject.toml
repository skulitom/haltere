[project]
name = "haltere"
version = "0.5.0"
description = "A connectome-constrained fruit-fly brain (male-CNS v1.0) trained to fly an FPV drone in Liftoff."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "tqdm>=4.66",
    "scipy>=1.13",
]

[project.optional-dependencies]
neuprint = ["neuprint-python>=0.4"]
liftoff = ["vgamepad>=0.1"]
# flying by sight, recording video and training the gate detector (imported lazily, so the
# connectome, simulator and training work without them)
vision = ["opencv-python-headless>=4.8", "mss>=9"]
publish = ["huggingface_hub>=0.23"]
dev = ["pytest>=8", "matplotlib>=3.9"]

[project.scripts]
haltere = "haltere.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haltere*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
