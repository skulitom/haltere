train:
  graph: data/built/flight
  B: 256
  T: 64
  iters: 1250
  lr: 0.0001
  lr_edges: 0.0001
  lr_readout: 0.0001
  grad_clip: 1.0
  delay_steps: 5
  randomize: 0.35
  difficulty_start: 0.8
  difficulty_end: 1.0
  difficulty_iters: 100
  eval_every: 50
  eval_steps: 400
  save_every: 100
  seed: 0
  device: cuda
  substeps: 2
  brain_detach_every: 8
  randomize_ctl: 0.4
task:
  height: 2.0
  target_box:
  - 3.0
  - 3.0
  - 1.0
  init_pos_jitter: 1.0
  init_vel_jitter: 1.0
  init_tilt_deg: 25.0
  init_rate_deg_s: 90.0
  episode_steps: 400
  switch_target_every: 0
  w_pos: 1.0
  w_vel: 0.05
  w_rate: 0.05
  w_up: 2.0
  w_act: 0.04
  w_dact: 0.8
  w_floor: 5.0
  w_crash: 20.0
  goal_scale: 2.0
  vel_scale: 3.0
  rate_scale: 2.0
brain:
  model: connectome
  dt: 0.01
  tau_init: 0.012
  gain_init: 3.0
  bias_init: -1.0
  encoder_gain: 12.0
  action_tau: 0.03
  readout_init: 0.0
  rate_max: 4.0
  readout_norm: batch
  learn_edges: true
  learn_unknown_signs: true
  edge_prior: 0.001
  rate_penalty: 0.001
  sensory:
    haltere: haltere
    wing_cs: wing_cs
    lptc: lptc
    ocelli: ocelli
    jo: jo
    compass: compass
    goal: goal
  motor:
  - wing_mn
  - premotor
quad:
  mass: 0.62
  inertia:
  - 0.0035
  - 0.004
  - 0.007
  arm_x: 0.09
  arm_y: 0.09
  twr: 5.8
  thrust_exp: 1.4
  motor_tau: 0.035
  yaw_coeff: 0.012
  drag_lin:
  - 0.05
  - 0.05
  - 0.1
  drag_quad:
  - 0.25
  - 0.25
  - 0.45
  ang_damp: 0.005
  gyro_noise: 0.02
ctl:
  P:
  - 29
  - 29
  - 30
  I:
  - 34
  - 36
  - 38
  D:
  - 22
  - 22
  - 0
  axis_gain:
  - 1.0
  - 1.0
  - 1.0
  idle: 0.04
rates:
  rc_rate:
  - 1.0
  - 1.0
  - 1.0
  super_rate:
  - 0.7
  - 0.7
  - 0.7
  expo:
  - 0.0
  - 0.0
  - 0.0
  throttle:
  - 0.0
  - 0.5
  - 1.0
  - 0.0
